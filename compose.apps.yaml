

name: badrlink-apps

x-app: &app
  restart: unless-stopped
  networks: [badrlink-net]

x-observability: &observability
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOYMENT_ENVIRONMENT:-local}
  MANAGEMENT_PORT: "9090"

services:

  auth:
    <<: *app
    image: ${IMAGE_PREFIX:-}messaging-auth-service:${AUTH_TAG:-local}
    build:
      context: ./messaging-auth-service
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: messaging-auth-service
      DB_HOST: postgres-auth
      DB_PORT: "5432"
      DB_NAME: auth_db
      DB_USER: auth_service
      DB_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
      JWT_ISSUER: http://auth:8081
      JWT_AUDIENCE: messaging-api
      JWT_ACCESS_TTL: PT15M
      JWT_REFRESH_TTL: P7D
      LOCKOUT_MAX_ATTEMPTS: "5"
      LOCKOUT_DURATION: PT15M
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      USER_SERVICE_URL: http://user:8082
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 3 http://127.0.0.1:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s


  user:
    <<: *app
    image: ${IMAGE_PREFIX:-}messaging-user-service:${USER_TAG:-local}
    build:
      context: ./messaging-user-service
    depends_on:
      auth:
        condition: service_healthy
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: messaging-user-service
      DB_HOST: postgres-user
      DB_PORT: "5432"
      DB_NAME: user_db
      DB_USER: user_service
      DB_PASSWORD: ${POSTGRES_USER_PASSWORD:?set POSTGRES_USER_PASSWORD to the value in messaging-infra/.env}
      JWT_JWK_SET_URI: http://auth:8081/oauth2/jwks
      AUTH_SERVICE_URL: http://auth:8081
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 3 http://127.0.0.1:8082/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s


  chat:
    <<: *app
    image: ${IMAGE_PREFIX:-}messaging-chat-service:${CHAT_TAG:-local}
    build:
      context: ./messaging-chat-service
    depends_on:
      user:
        condition: service_healthy
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: messaging-chat-service
      CHAT_SERVICE_PORT: "8083"
      MONGODB_URI: "mongodb://root:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD to the value in messaging-infra/.env}@mongodb:27017/messaging_chat?authSource=admin&replicaSet=rs0"
      AUTH_JWK_SET_URI: http://auth:8081/oauth2/jwks
      CHAT_INTERNAL_SERVICE_TOKEN: ${INTERNAL_HMAC_SECRET}
      USER_SERVICE_BASE_URL: http://user:8082
      USER_SERVICE_INTERNAL_TOKEN: ${INTERNAL_HMAC_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 3 http://127.0.0.1:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s


  realtime:
    <<: *app
    image: ${IMAGE_PREFIX:-}messaging-realtime-gateway:${REALTIME_TAG:-local}
    build:
      context: ./messaging-realtime-gateway
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: messaging-realtime-gateway
      SERVER_PORT: "8084"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
      AUTH_JWKS_URI: http://auth:8081/oauth2/jwks
      AUTH_ISSUER: http://auth:8081
      AUTH_AUDIENCE: messaging-api
      UPSTREAM_CHAT_SERVICE: http://chat:8083
      UPSTREAM_USER_SERVICE: http://user:8082
      USER_SERVICE_INTERNAL_TOKEN: ${INTERNAL_HMAC_SECRET}
      PRESENCE_TTL_SECONDS: "30"
      HEARTBEAT_INTERVAL_MS: "10000"
      MESSAGE_RATE_REPLENISH: "10"
      MESSAGE_RATE_BURST: "20"
      TYPING_RATE_REPLENISH: "5"
      TYPING_RATE_BURST: "10"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 3 http://127.0.0.1:8084/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s


  notification:
    <<: *app
    image: ${IMAGE_PREFIX:-}messaging-notification-service:${NOTIFICATION_TAG:-local}
    build:
      context: ./messaging-notification-service
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: messaging-notification-service
      NOTIFICATION_SERVICE_PORT: "8085"
      DB_HOST: postgres-notification
      DB_PORT: "5432"
      DB_NAME: notification_db
      DB_USER: notification_service
      DB_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:?set POSTGRES_NOTIFICATION_PASSWORD to the value in messaging-infra/.env}
      JWT_JWK_SET_URI: http://auth:8081/oauth2/jwks
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 3 http://127.0.0.1:8085/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  attachment:
    <<: *app
    image: ${IMAGE_PREFIX:-}messaging-attachment-service:${ATTACHMENT_TAG:-local}
    build:
      context: ./messaging-attachment-service
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: messaging-attachment-service
      ATTACHMENT_SERVICE_PORT: "8086"
      DB_HOST: postgres-attachment
      DB_PORT: "5432"
      DB_NAME: attachment_db
      DB_USER: attachment_service
      DB_PASSWORD: ${POSTGRES_ATTACHMENT_PASSWORD:?set POSTGRES_ATTACHMENT_PASSWORD to the value in messaging-infra/.env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER to the value in messaging-infra/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD to the value in messaging-infra/.env}
      MINIO_ATTACHMENT_BUCKET: ${MINIO_ATTACHMENT_BUCKET:-badrlink-attachments}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-badrlink-quarantine}
      CHAT_SERVICE_BASE_URL: http://chat:8083
      CHAT_INTERNAL_SERVICE_TOKEN: ${INTERNAL_HMAC_SECRET}
      JWT_JWK_SET_URI: http://auth:8081/oauth2/jwks
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 3 http://127.0.0.1:8086/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  gateway:
    <<: *app
    image: ${IMAGE_PREFIX:-}messaging-api-gateway:${GATEWAY_TAG:-local}
    build:
      context: ./messaging-api-gateway
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      chat:
        condition: service_healthy
      realtime:
        condition: service_healthy
      notification:
        condition: service_healthy
      attachment:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: messaging-api-gateway
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      UPSTREAM_AUTH_SERVICE: http://auth:8081
      UPSTREAM_USER_SERVICE: http://user:8082
      UPSTREAM_CHAT_SERVICE: http://chat:8083
      UPSTREAM_REALTIME_GATEWAY: http://realtime:8084
      UPSTREAM_NOTIFICATION_SERVICE: http://notification:8085
      UPSTREAM_ATTACHMENT_SERVICE: http://attachment:8086
      AUTH_JWKS_URI: http://auth:8081/oauth2/jwks
      AUTH_ISSUER: http://auth:8081
      AUTH_AUDIENCE: messaging-api
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 3 http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s


  frontend:
    <<: *app
    image: ${IMAGE_PREFIX:-}messaging-frontend:${FRONTEND_TAG:-local}
    build:
      context: ./messaging-frontend
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080/ws}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  badrlink-net:
    external: true